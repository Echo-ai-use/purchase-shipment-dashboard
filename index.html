<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>采购单发货跟踪看板</title>
<style>
:root{--bg:#050d1a;--panel:#0a1626;--panel2:#0e1d33;--line:#16304f;--cyan:#22d3ee;--text:#dbe9f7;--dim:#7f9ab5;--red:#f87171;--green:#34d399;--amber:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
h1{font-size:21px;font-weight:600;letter-spacing:.5px}
.sub{color:var(--dim);font-size:12px;margin-top:5px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.btn-add{background:linear-gradient(135deg,#22d3ee,#0ea5b7);color:#04121f;border:none;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 4px 20px rgba(34,211,238,.25)}
.btn-add:hover{filter:brightness(1.1)}
.btn-link{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 18px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 24px;min-width:150px}
.stat .v{font-size:28px;font-weight:700}
.stat .l{color:var(--dim);font-size:12px;margin-top:2px}
.v.cyan{color:var(--cyan)} .v.red{color:var(--red)} .v.green{color:var(--green)} .v.amber{color:var(--amber)}
.bar{display:flex;gap:10px;margin:6px 0 14px;flex-wrap:wrap;align-items:center}
.bar input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;outline:none;min-width:280px}
.bar input:focus{border-color:var(--cyan)}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
.btn.active{border-color:var(--cyan);color:var(--cyan)}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th{position:sticky;top:0;background:var(--panel2);color:var(--dim);font-size:12px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #0e2338;font-size:13px;vertical-align:top}
tr.uns td{background:rgba(248,113,113,.06)}
tr:hover td{background:rgba(34,211,238,.05)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;white-space:nowrap}
.tag.uns{background:rgba(248,113,113,.15);color:var(--red)}
.tag.shp{background:rgba(52,211,153,.15);color:var(--green)}
.tag.nf{background:rgba(251,191,36,.15);color:var(--amber)}
.mono{font-family:ui-monospace,Menlo,monospace}
.dim{color:var(--dim)}
.sales{color:var(--cyan);font-weight:600}
.count{color:var(--dim);font-size:12px;margin:8px 2px}
.scroll{max-height:calc(100vh - 250px);overflow:auto;border-radius:12px;border:1px solid var(--line)}
.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.empty .big{font-size:40px;margin-bottom:12px}
.hint{background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.25);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:13px;color:var(--text)}
.hint b{color:var(--cyan)}
</style>
</head>
<body>
<div class="head">
  <div>
    <h1>📦 采购单发货跟踪看板</h1>
    <div class="sub">只跟踪手动登记的单 ｜ 巡检时间：<span id="ft"></span> ｜ 数据源：马帮ERP（只读）+ 飞书清单</div>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <a class="btn-add" id="btnTable" target="_blank">➕ 登记采购单</a>
    <a class="btn-link" id="btnForm" target="_blank">📝 表单登记</a>
  </div>
</div>

<div class="hint">💡 在「<b>登记采购单</b>」在线表里直接填 <b>采购单号 + 对应销售</b> 两列即可加入跟踪；系统每 3 小时自动查询发货状态并回填，<b>未发货的会推送卡片到永瘦宫群</b>提醒。</div>

<div class="stats">
  <div class="stat"><div class="v cyan" id="s-total"></div><div class="l">已登记跟踪</div></div>
  <div class="stat"><div class="v red" id="s-uns"></div><div class="l">未发货（每3小时提醒）</div></div>
  <div class="stat"><div class="v green" id="s-shp"></div><div class="l">已发货</div></div>
  <div class="stat"><div class="v amber" id="s-nf"></div><div class="l">单号未找到</div></div>
  <div class="stat"><div class="v cyan" id="s-sales"></div><div class="l">涉及销售</div></div>
</div>

<div class="bar">
  <input id="q" placeholder="搜索单号 / 销售 / 供应商 / 1688单号 / SKU…">
  <button class="btn active" data-f="all">全部</button>
  <button class="btn" data-f="未发货">未发货</button>
  <button class="btn" data-f="已发货">已发货</button>
  <button class="btn" data-f="未找到">未找到</button>
</div>
<div class="count" id="cnt"></div>
<div class="scroll">
<table>
<thead><tr><th>状态</th><th>对应销售</th><th>采购单号</th><th>供应商</th><th>1688 单号</th><th>金额(¥)</th><th>仓库</th><th>商品</th><th>建单时间</th><th>快递单号</th></tr></thead>
<tbody id="tb"></tbody>
</table>
<div class="empty" id="empty" style="display:none"><div class="big">📭</div>还没有登记采购单<br><br><a class="btn-add" id="btnTable2" target="_blank">➕ 去登记第一张采购单</a></div>
</div>
<script>
const DATA = {"fetchedAt":"2026-11-20T14:59:14.349Z","total":14,"unshipped":0,"formUrl":"https://dxqo9m5r0ri.feishu.cn/share/base/shrcn15DGnG4CGNkyz0bZmWxwPd","tableUrl":"https://dxqo9m5r0ri.feishu.cn/base/C5zHbkq6SaocEws7zUWcsYKUnHb","orders":[{"no":"1852965610","sl":"josie","p":"义乌市炎北日用百货有限公司","a":"3316599662004007098","s":"已发货","e":"顺丰速运 SF0203181571069","amt":84.96,"wh":"销售三组仓","ct":"2026-11-19 20:13:46","sku":"塑料裁纸刀-黑色","gid":"1852965610"},{"no":"1852965608","sl":"josie","p":"东莞市众宬家居有限公司","a":"3317207520001052290","s":"已发货","e":"other","amt":2014,"wh":"销售三组仓","ct":"2026-11-19 20:13:45","sku":"骑行保暖面罩-胡子爷爷冰丝款","gid":"1852965608"},{"no":"1852965750","sl":"张芷瑜","p":"深圳市嗨小趣科技有限公司","a":"3316586163003016280","s":"已发货","e":"中通快递(ZTO) 79049514794099","amt":93.2,"wh":"销售三组仓","ct":"2026-11-19 22:06:25","sku":"女式震动器-粉色9频震动APP款","gid":"1852965750"},{"no":"1852965606","sl":"Josie","p":"东阳市云手匠工艺品有限公司","a":"3316597430104143491","s":"已发货","e":"圆通速递(YTO) YT7657735767139","amt":2955,"wh":"销售三组仓","ct":"2026-11-19 19:06:56","sku":"LED 训练卡-摩斯训练卡新款订单留言：不要电池","gid":"1852965606"},{"no":"1852965609","sl":"josie","p":"瑞安市或栖贸易商行","a":"3317029285097016280","s":"已发货","e":"SF5166048132860","amt":435,"wh":"销售三组仓","ct":"2026-11-19 20:13:46","sku":"节日表演道具-肤色款均码","gid":"1852965609"},{"no":"1852965680","sl":"杨金倩","p":"金华市信天游旅行用品有限公司","a":"3317207736001016280","s":"已发货","e":"中通快递(ZTO) 79049502015738","amt":28.9,"wh":"销售三组仓","ct":"2026-11-19 20:14:35","sku":"男士洗漱包-藏青","gid":"1852965680"},{"no":"1852965616","sl":"杨金倩","p":"义乌市巨凯工艺品厂","a":"3317030437009016280","s":"已发货","e":"中通快递(ZTO) 79049536050813","amt":4,"wh":"销售三组仓","ct":"2026-11-19 20:13:51","sku":"PVC 行李牌-天蓝色","gid":"1852965616"},{"no":"1852965583","sl":"杨金倩","p":"温州鼎厨工艺品有限公司","a":"3316598078091098299","s":"已发货","e":"韵达快递 435453148414465","amt":115,"wh":"销售三组仓","ct":"2026-11-19 16:07:23","sku":"电动扫雪机-黑色","gid":"1852965583"},{"no":"1852964896","sl":"杨金倩","p":"广州丰仓皮具有限公司","a":"3317028313078098299","s":"已发货","e":"韵达快递 435452390549797","amt":22,"wh":"销售三组仓","ct":"2026-11-19 11:47:13","sku":"纺织护照包-宝蓝","gid":"1852964896"},{"no":"1852964895","sl":"杨金倩","p":"保定臻驰商贸有限公司","a":"3316583859072016280","s":"已发货","e":"中通快递(ZTO) 79049403631971","amt":31,"wh":"销售三组仓","ct":"2026-11-19 11:47:03","sku":"女士尼龙腰包-黑色","gid":"1852964895"},{"no":"1852964891","sl":"杨金倩","p":"潮州市潮安区彩塘镇燃力不锈钢制品厂","a":"3317027413097016280","s":"已发货","e":"极兔速递 JT3185173786017","amt":97.4,"wh":"销售三组仓","ct":"2026-11-19 11:46:27","sku":"不锈钢浴室搁板-拉丝30厘米（订单留言：不带胶水发货）","gid":"1852964891"},{"no":"1852965894","sl":"马淑珍","p":"阳江金朗智能宠物用品有限公司","a":"3316600670017007098","s":"已发货","e":"圆通速递(YTO) YT7657760777271","amt":79,"wh":"销售三组仓","ct":"2026-11-20 10:39:31","sku":"电子训狗器-8801黑带","gid":"1852965894"},{"no":"1852964662","sl":"马淑珍","p":"义乌市欧超饰品厂","a":"3317205360061143491","s":"已发货","e":"中通快递(ZTO) 79049237779806","amt":106.92,"wh":"销售三组仓","ct":"2026-11-18 21:40:52","sku":"女式首饰套装-项链金蓝粉","gid":"1852964662"},{"no":"1852966395","sl":"马淑珍","p":"深圳市骋制科技有限公司","a":"3317032381026016280","s":"已发货","e":"中通快递(ZTO) 73738205890721","amt":35,"wh":"销售三组仓","ct":"2026-11-20 14:45:42","sku":"家用美容仪-白色","gid":"1852966395"}]};
let filter='all';
document.getElementById('ft').textContent=new Date(DATA.fetchedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});
document.getElementById('btnTable').href=DATA.tableUrl;
document.getElementById('btnTable2').href=DATA.tableUrl;
document.getElementById('btnForm').href=DATA.formUrl;
const c={'未发货':0,'已发货':0,'未找到':0};
DATA.orders.forEach(o=>{if(c[o.s]!==undefined)c[o.s]++});
document.getElementById('s-total').textContent=DATA.total;
document.getElementById('s-uns').textContent=c['未发货'];
document.getElementById('s-shp').textContent=c['已发货'];
document.getElementById('s-nf').textContent=c['未找到'];
document.getElementById('s-sales').textContent=new Set(DATA.orders.map(o=>o.sl).filter(Boolean)).size;
const tagMap={'未发货':'uns','已发货':'shp','未找到':'nf'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const rows=DATA.orders.filter(o=>(filter==='all'||o.s===filter)&&(!q||(o.no+o.sl+o.p+o.a+o.sku+o.gid).toLowerCase().includes(q)));
  document.getElementById('cnt').textContent='显示 '+rows.length+' 条';
  document.getElementById('empty').style.display=DATA.total===0?'block':'none';
  document.getElementById('tb').innerHTML=rows.map(o=>
    '<tr class="'+(o.s==='未发货'?'uns':'')+'">'
    +'<td><span class="tag '+(tagMap[o.s]||'')+'">'+esc(o.s)+'</span></td>'
    +'<td>'+(o.sl?'<span class="sales">'+esc(o.sl)+'</span>':'<span class="dim">—</span>')+'</td>'
    +'<td class="mono">'+esc(o.no)+'</td>'
    +'<td>'+esc(o.p)+'</td>'
    +'<td class="mono">'+(o.a?esc(o.a):'<span class="dim">—</span>')+'</td>'
    +'<td class="mono">'+(o.amt||0).toFixed(0)+'</td>'
    +'<td class="dim">'+esc(o.wh)+'</td>'
    +'<td>'+esc((o.sku||'').slice(0,30))+'</td>'
    +'<td class="dim">'+esc(o.ct)+'</td>'
    +'<td class="dim mono">'+esc(o.e||'—')+'</td></tr>'
  ).join('');
}
document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('.btn[data-f]').forEach(b=>b.addEventListener('click',()=>{
  filter=b.dataset.f;
  document.querySelectorAll('.btn[data-f]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');render();
}));
render();
</script>
</body>
</html>
